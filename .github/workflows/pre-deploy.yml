name: Pre-Deployment Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-deploy-check:
    name: Lint, Build & Syntax Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: 📦 Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: 📦 Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: 🔍 Stage 1 - Client Lint (ESLint)
        run: |
          cd client
          npm run lint

      - name: 🏗 Stage 2 - Client Production Build (Vite)
        run: |
          cd client
          npm run build

      - name: ⚡ Stage 3 - Server Syntax & Entry Validation
        run: |
          node --check server/server.js
          node --check server/db.js
          for file in server/routes/*.js; do
            node --check "$file"
          done

      - name: 🚀 Stage 4 - Run Full Pre-Deployment Script
        run: |
          node scripts/pre-deploy.js

      - name: ✅ Deployment Readiness Confirmed
        run: |
          echo "=========================================================="
          echo "All pre-deployment checks passed successfully!"
          echo "This commit is clean and safe to deploy to production."
          echo "=========================================================="
